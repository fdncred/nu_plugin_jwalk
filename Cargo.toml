[package]
name = "nu_plugin_jwalk"
version = "0.28.0"
authors = ["Darren Schroeder"]
edition = "2024"
repository = "https://github.com/fdncred/nu_plugin_jwalk"
description = "a nushell plugin called jwalk"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# nushell dependencies
nu-plugin = "0.114.1"
nu-protocol = "0.114.1"
nu-path = "0.114.1"

# for local development, you can use a path dependency
# nu-plugin = { path = "../nushell/crates/nu-plugin", version = "0.98.0" }
# nu-protocol = { path = "../nushell/crates/nu-protocol", version = "0.98.0" }
# nu-path = { path = "../nushell/crates/nu-path", version = "0.98.0" }

jwalk = "0.9.0"
dua-core = "2.41.1"
zlob = "1.6.2"
chrono = "0.4.45"
omnipath = "0.1.6"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3     # Optimize for size
strip = "debuginfo"
lto = "thin"

[profile.dev]
opt-level = 0
