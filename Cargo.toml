[package]
name = "nu_plugin_jwalk"
version = "0.29.0"
authors = ["Darren Schroeder"]
edition = "2024"
repository = "https://github.com/fdncred/nu_plugin_jwalk"
description = "a nushell plugin called jwalk"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# nushell dependencies
nu-plugin = "0.115.0"
nu-protocol = "0.115.0"
nu-path = "0.115.0"

# for local development, you can use a path dependency
# nu-plugin = { path = "../nushell/crates/nu-plugin", version = "0.98.0" }
# nu-protocol = { path = "../nushell/crates/nu-protocol", version = "0.98.0" }
# nu-path = { path = "../nushell/crates/nu-path", version = "0.98.0" }

jwalk = "0.9.0"
dua-core = "3.1.0"
ignore = "0.4.33"
walkdir = "2.5.0"
zlob = { version = "1.6.3", optional = true }
chrono = "0.4.45"
omnipath = "0.1.6"

[features]
default = []
# zlob links a Zig walk implementation; the Zig toolchain must be on PATH.
zlob = ["dep:zlob"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3     # Optimize for speed
strip = "debuginfo"
lto = "thin"

[profile.dev]
opt-level = 0

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.'cfg(windows)']
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
