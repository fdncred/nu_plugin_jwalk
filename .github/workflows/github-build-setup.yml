name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Cargo build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install libclang (Linux)
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libclang-dev
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y libclang-dev
          fi

      - name: Build plugin
        run: cargo build --features zlob --locked
